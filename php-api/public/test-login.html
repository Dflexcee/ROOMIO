<!DOCTYPE html>
<html>
<head>
    <title>Test Login</title>
</head>
<body>
    <h1>Test Login</h1>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" value="test@example.com" required>
        <input type="password" id="password" placeholder="Password" value="Test!234" required>
        <button type="submit">Login</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                // Login
                const loginResponse = await fetch('/roomio/php-api/public/auth/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                
                const loginData = await loginResponse.json();
                document.getElementById('result').innerHTML = '<h3>Login Response:</h3><pre>' + JSON.stringify(loginData, null, 2) + '</pre>';
                
                // Test me endpoint
                const meResponse = await fetch('/roomio/php-api/public/auth/me.php', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                const meData = await meResponse.json();
                document.getElementById('result').innerHTML += '<h3>Me Response:</h3><pre>' + JSON.stringify(meData, null, 2) + '</pre>';
                
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        });
    </script>
</body>
</html>
